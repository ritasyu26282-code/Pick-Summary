<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>檔案上傳元件預覽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 p-10 flex items-center justify-center min-h-screen">

    <!-- 雙欄佈局容器 -->
    <div class="w-full max-w-3xl grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- 左側：檔案上傳區域 (佔 2 欄) -->
        <section id="upload-section" class="md:col-span-2 bg-white rounded-lg border-2 border-dashed border-slate-300 p-6 text-center hover:border-indigo-500 transition-colors duration-200 cursor-pointer relative shadow-sm group">
            <input type="file" id="csv-file-input" accept=".csv, .txt" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
            
            <div class="flex flex-col items-center justify-center space-y-3 pointer-events-none">
                <div class="p-3 bg-indigo-50 text-indigo-600 rounded-full group-hover:scale-105 transition-transform duration-200">
                    <i data-lucide="upload-cloud" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-sm font-semibold text-slate-700">拖曳檔案至此，或點擊上傳</p>
                    <p class="text-[10px] text-slate-400 mt-1">支援 .csv, .txt (UTF-8)</p>
                </div>
            </div>
        </section>

        <!-- 右側：統計數據區域 -->
        <div class="flex flex-col gap-6">
            <!-- 統計卡片 1 -->
            <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 flex flex-col justify-center">
                <p class="text-slate-400 text-xs font-medium uppercase tracking-wider">處理總數</p>
                <p class="text-2xl font-bold text-slate-800">1,284</p>
            </div>
            <!-- 統計卡片 2 -->
            <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 flex flex-col justify-center">
                <p class="text-slate-400 text-xs font-medium uppercase tracking-wider">錯誤率</p>
                <p class="text-2xl font-bold text-rose-500">0.4%</p>
            </div>
        </div>
    </div>

    <script>
        // 初始化 Lucide 圖示
        lucide.createIcons();
    </script>
</body>
</html>
